<!DOCTYPE html>
<html lang="fr">
<head><meta name="allchatbots-layout" content="large">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Ashen - Prototype</title>
<style>
:root{
  --ink:#2b1d0e; --ink2:#5e4b30; --brown:#5a3a10;
  --parch:#f6eedb; --parch2:#e4d2a4;
  --gold:#b98a3e; --gold2:#f1d48a; --goldd:#6b4c1a;
  --dark:#120e1b; --dark2:#241c34; --txt:#efe6d0; --muted:#c2b38f;
  --common:#9aa6b4; --rare:#4fa3e0; --epic:#a465e0; --legend:#f0a52e; --red:#b8382c; --green:#3f8f4a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--txt); font-family:Georgia,"Times New Roman",serif; min-height:100vh;
  background:
    radial-gradient(ellipse at 12% 0%, #3d2f63 0%, transparent 48%),
    radial-gradient(ellipse at 92% 8%, #5c2f2a 0%, transparent 42%),
    linear-gradient(180deg,#1b1429,#0c0913 70%);
  background-attachment:fixed;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:0;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 12px);
}

/* ===== En-tête ===== */
header{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:10px 22px; background:linear-gradient(90deg,#0a0710,#1d1632 50%,#0a0710);
  border-bottom:2px solid var(--gold); box-shadow:0 6px 24px #000c;
}
.logo{font-size:24px; letter-spacing:3px; font-weight:bold; white-space:nowrap; line-height:1;
  background:linear-gradient(180deg,#fff4cf,#d9a84e 60%,#9c6c1f); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 0 #000)}
.logo small{display:block; font-size:10px; letter-spacing:7px; margin-top:4px}
nav{display:flex; gap:6px; flex-wrap:wrap}
nav button{
  background:none; border:1px solid transparent; color:var(--muted); padding:8px 14px; font:inherit; font-size:15px;
  cursor:pointer; border-radius:4px; transition:color .2s, border-color .2s, background .2s;
}
nav button:hover{color:var(--txt); border-color:#4a3d22}
nav button.on{color:var(--gold2); border-color:var(--gold); background:linear-gradient(180deg,#3a2b12,#1b1409); box-shadow:inset 0 -2px 0 var(--gold2), 0 0 12px -3px var(--gold)}
nav button.abyss{color:#c39bff}
nav button.abyss.on{color:#e3c8ff; border-color:#9b6bd6; background:linear-gradient(180deg,#2d1a48,#140c24); box-shadow:0 0 14px -3px #a465e0}
.wallet{margin-left:auto; display:flex; gap:10px; font-size:14px; flex-wrap:wrap}
.wallet span{background:rgba(18,14,27,.85); border:1px solid var(--gold); padding:6px 12px; border-radius:4px; box-shadow:inset 0 0 8px #0008}
.wallet b{color:var(--gold2)}

/* ===== Structure ===== */
main{position:relative; z-index:1; padding:26px 24px 60px; max-width:1200px; margin:0 auto}
.banner{
  position:relative; padding:22px 28px; margin-bottom:22px; border-radius:8px;
  background:linear-gradient(100deg,rgba(18,12,30,.96),rgba(44,30,66,.85) 60%,rgba(92,47,42,.7));
  border:2px solid var(--gold);
  box-shadow:inset 0 0 0 4px #0c0913, inset 0 0 0 5px rgba(185,138,62,.45), 0 12px 30px #000a;
}
h1{font-size:30px; color:var(--gold2); margin:0 0 6px; text-shadow:0 2px 0 #000}
h1::after{content:""; display:block; width:140px; height:2px; margin-top:10px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
h2{font-size:20px; color:var(--brown); margin:0 0 10px}
.dark h2{color:var(--gold2)}
.sub{color:var(--muted); margin:0; line-height:1.5}
.panel{
  position:relative; background:linear-gradient(180deg,var(--parch),var(--parch2)); color:var(--ink);
  border:3px double #8a6a2c; border-radius:10px; padding:20px; margin-bottom:22px;
  box-shadow:0 12px 28px #0009, inset 0 0 40px rgba(120,80,20,.12);
}
.panel.dark{background:linear-gradient(170deg,#2c2145,#120e1b); color:var(--txt); border-color:var(--gold)}
.panel.dark .hint{color:var(--muted)}
.row{display:grid; gap:22px; grid-template-columns:1fr 1fr}
@media(max-width:820px){.row{grid-template-columns:1fr}}
.hint{font-size:13px; color:var(--ink2); line-height:1.5}
.grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.chip{background:rgba(255,255,255,.45); border:1px solid #b08a48; color:var(--brown); padding:6px 14px; border-radius:16px; cursor:pointer; font:inherit; font-size:13px; transition:transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip.on{color:#1a1208; background:linear-gradient(180deg,#f7de98,#b98a3e); border-color:var(--goldd); box-shadow:0 2px 0 var(--goldd)}
.panel.dark .chip{background:rgba(0,0,0,.25); color:var(--txt)}
.panel.dark .chip.on{color:#1a1208}

/* ===== Cartes ===== */
.card{
  position:relative; min-height:200px; padding:9px; border-radius:10px; cursor:pointer;
  border:2px solid var(--c,#888);
  background:linear-gradient(165deg,#2e2648,#140f1e 70%);
  box-shadow:0 5px 12px rgba(0,0,0,.45), inset 0 0 0 2px #0a0710, inset 0 0 0 3px rgba(241,212,138,.28);
  display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden;
  transition:transform .18s, box-shadow .18s;
}
.card:hover{transform:translateY(-4px); box-shadow:0 10px 22px rgba(0,0,0,.55), 0 0 18px -2px var(--c), inset 0 0 0 2px #0a0710, inset 0 0 0 3px rgba(241,212,138,.4)}
.card.sel{outline:2px solid var(--gold2); outline-offset:3px; box-shadow:0 0 22px -2px var(--c), inset 0 0 0 2px #0a0710}
.card.locked{filter:grayscale(1) brightness(.45); cursor:default}
.card.locked:hover{transform:none; box-shadow:0 5px 12px rgba(0,0,0,.45), inset 0 0 0 2px #0a0710}
.card.shine::after{
  content:""; position:absolute; inset:0; pointer-events:none; border-radius:8px;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.32) 50%,transparent 62%);
  background-size:260% 100%; animation:sheen 3.6s ease-in-out infinite;
}
.card.legend{box-shadow:0 0 18px -2px var(--c), 0 5px 12px rgba(0,0,0,.45), inset 0 0 0 2px #0a0710, inset 0 0 0 3px rgba(241,212,138,.4)}
.art{
  position:relative; width:100%; aspect-ratio:1/1.05; border-radius:6px; margin-bottom:8px;
  display:flex; align-items:center; justify-content:center; color:#fff; text-shadow:0 2px 6px #000;
  border:1px solid rgba(0,0,0,.6); box-shadow:inset 0 0 18px rgba(0,0,0,.6);
}
.art svg{width:58%; height:58%}
.count{position:absolute; top:-6px; right:-6px; z-index:2; min-width:28px; height:28px; padding:0 6px;
  display:flex; align-items:center; justify-content:center; border-radius:14px;
  background:radial-gradient(circle at 35% 30%,#fff4cf,#b98a3e); color:#1a1208; font-size:12px; font-weight:bold;
  border:2px solid #0a0710; box-shadow:0 2px 6px #000}
.name{font-size:15px; font-weight:bold; color:var(--gold2); letter-spacing:.5px}
.rar{font-size:10px; text-transform:uppercase; letter-spacing:2.5px; color:var(--c); margin-top:2px}
.meta{font-size:12px; color:#b9ab8c; margin-top:4px; line-height:1.35}
.stars{color:var(--gold2); letter-spacing:1px; font-size:13px}
.card.reveal{animation:pop .7s cubic-bezier(.2,1.4,.5,1)}

/* ===== Boutons ===== */
.btn{
  display:inline-block; background:linear-gradient(180deg,#f7de98,#b98a3e); color:#1a1208;
  border:1px solid var(--goldd); padding:10px 20px; border-radius:6px; font:inherit; font-weight:bold;
  cursor:pointer; margin-top:10px; box-shadow:inset 0 1px 0 #fff9, 0 4px 0 var(--goldd), 0 8px 16px rgba(0,0,0,.35);
  transition:transform .08s, box-shadow .08s, filter .2s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px); box-shadow:inset 0 1px 0 #fff9, 0 1px 0 var(--goldd)}
.btn:disabled{opacity:.4; cursor:not-allowed; filter:grayscale(.6); transform:none; box-shadow:none}
.btn.ghost{background:transparent; color:var(--brown); border:1px solid #8a6a2c; box-shadow:none}
.btn.ghost:hover{background:rgba(185,138,62,.12)}
.panel.dark .btn.ghost, .banner .btn.ghost{color:var(--gold2)}
.btn.abyssbtn{background:linear-gradient(180deg,#c9a4ff,#7a4fc9); color:#fff; border-color:#4b2d86; box-shadow:inset 0 1px 0 #fff5, 0 4px 0 #4b2d86, 0 8px 16px rgba(0,0,0,.35)}

/* ===== Stats ===== */
.stat{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid rgba(90,58,16,.25); font-size:15px}
.stat b{color:var(--brown)}
.bar{height:12px; background:#d6c291; border-radius:6px; overflow:hidden; border:1px solid #8a6a2c; margin:8px 0; box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,#6a3fc0,#c48cff 60%,#e6c9ff); box-shadow:0 0 10px #a465e0; transition:width .5s ease}

/* ===== Évolution ===== */
.evo-stage{display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; padding:10px 0}
.arrows{font-size:36px; color:var(--gold); text-shadow:0 2px 0 #000; animation:nudge 1.4s ease-in-out infinite}
.evo-next{width:170px; opacity:.8}
.evo-next.maxed{opacity:1}
.evo-next .card{box-shadow:0 0 16px -3px var(--c), inset 0 0 0 2px #0a0710}

/* ===== Équipement ===== */
.slots{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0}
.slot{
  border:2px dashed #8a6a2c; border-radius:8px; padding:10px 8px; text-align:center; min-height:130px; cursor:pointer;
  background:linear-gradient(180deg,#2a2140,#120e1b); color:var(--muted); font-size:12px; transition:transform .15s, box-shadow .15s;
}
.slot:hover{transform:translateY(-2px); border-color:var(--gold2)}
.slot.full{border:2px solid var(--c); box-shadow:0 0 14px -3px var(--c), inset 0 0 14px rgba(0,0,0,.5)}
.slot .big{font-size:30px; color:var(--gold2)}
.slot .lbl{font-size:10px; text-transform:uppercase; letter-spacing:2px; color:var(--gold2); margin-bottom:4px}
.eqlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:10px; margin-top:10px}
.eq{
  border:2px solid var(--c); border-radius:8px; padding:10px; cursor:pointer; font-size:13px;
  background:linear-gradient(170deg,#fffaf0,#ecdcb3); box-shadow:0 3px 8px rgba(0,0,0,.2); transition:transform .15s, box-shadow .15s;
}
.eq:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,.3), 0 0 10px -2px var(--c)}
.eq.worn{opacity:.55}
.eq .t{font-weight:bold; color:var(--ink)}

/* ===== Donjons ===== */
.dungeon{display:grid; grid-template-columns:260px 1fr; gap:26px; align-items:center}
@media(max-width:820px){.dungeon{grid-template-columns:1fr}}
.gate{
  position:relative; width:230px; height:260px; margin:0 auto; border-radius:115px 115px 10px 10px;
  border:8px solid #4a4256; box-shadow:inset 0 0 40px #000, 0 0 0 3px #1a1424, 0 0 40px -6px #e0584a;
  background:radial-gradient(ellipse at 50% 80%, #ff7a3a 0%, #5a1d2a 35%, #120a14 75%);
  overflow:hidden;
}
.gate::before{content:""; position:absolute; left:50%; top:30%; width:70px; height:70px; transform:translate(-50%,-50%) rotate(45deg);
  border:3px solid #ffb37a; box-shadow:0 0 20px #ff7a3a; animation:glow 2.6s ease-in-out infinite}
.gate::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(255,122,58,.25)); animation:flicker 3s infinite}
.dv h2{font-size:22px}
.reveal-box{margin-top:14px; display:flex; gap:14px; align-items:center; padding:12px; border-radius:8px; background:rgba(0,0,0,.25); border:1px solid rgba(241,212,138,.3); min-height:60px}
.reveal-box .card{width:150px; flex:0 0 auto}
.log{margin-top:12px; font-size:15px; color:var(--gold2); min-height:22px}

/* ===== Abîme ===== */
.abyss-wrap{background:linear-gradient(170deg,#2a1748,#0f0a1c)!important; color:var(--txt)!important; border-color:#9b6bd6!important}
.abyss-wrap h2{color:#e3c8ff}
.abyss-wrap .hint{color:#c9b6e8}
.abyss-cell .btn{width:100%; margin-top:8px}
.abyss-cell .card{cursor:default}

/* ===== Raretés ===== */
.rarity-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.rarity-row div{border-left:5px solid var(--c); padding:12px 14px; background:linear-gradient(170deg,#fffaf0,#ecdcb3); color:var(--ink); border-radius:6px; font-size:14px; line-height:1.5; box-shadow:0 3px 8px rgba(0,0,0,.2)}

/* ===== Toast ===== */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0; pointer-events:none;
  background:linear-gradient(180deg,#1d1632,#0a0710); border:2px solid var(--gold); color:var(--gold2);
  padding:12px 22px; border-radius:6px; box-shadow:0 10px 30px #000c; transition:opacity .3s, transform .3s; z-index:10; font-size:15px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

select{background:var(--parch); color:var(--ink); border:1px solid #8a6a2c; padding:8px; border-radius:6px; font:inherit}

@keyframes sheen{0%{background-position:150% 0}100%{background-position:-150% 0}}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.6}50%{transform:translateX(6px);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 12px #ff7a3a}50%{box-shadow:0 0 30px #ffb37a}}
@keyframes flicker{0%,100%{opacity:.8}50%{opacity:.4}}
</style>
</head>
<body>
<header>
  <div class="logo">PROJECT<small>ASHEN</small></div>
  <nav id="nav"></nav>
  <div class="wallet">
    <span>Points d'Âme : <b id="pts"></b></span>
    <span>Cartes : <b id="total"></b></span>
  </div>
</header>

<main>
  <section id="v-collection"></section>
  <section id="v-evolution" hidden></section>
  <section id="v-equip" hidden></section>
  <section id="v-dungeon" hidden></section>
  <section id="v-abyss" hidden></section>
  <section id="v-rarity" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>
const RAR = {
  commune:{name:"Commune",c:"var(--common)",stars:1,drop:60,sell:50},
  rare:{name:"Rare",c:"var(--rare)",stars:2,drop:28,sell:150},
  epique:{name:"Épique",c:"var(--epic)",stars:3,drop:9,sell:400},
  legendaire:{name:"Légendaire",c:"var(--legend)",stars:4,drop:3,sell:1000}
};

const HEROES = [
  {id:"kael",name:"Kael",type:"Personnage",rar:"legendaire",hue:"#7a3a2a",atk:312,pv:1240,def:210,desc:"Guerrier au marteau, héritier de la forge d'Ashen."},
  {id:"lyra",name:"Lyra",type:"Personnage",rar:"epique",hue:"#3d5a8a",atk:264,pv:980,def:150,desc:"Archère des ruines, rapide et précise."},
  {id:"mirah",name:"Mirah",type:"Personnage",rar:"epique",hue:"#5a3a7a",atk:290,pv:900,def:120,desc:"Mage des cendres, dégâts de zone."},
  {id:"dorn",name:"Dorn",type:"Personnage",rar:"rare",hue:"#4a5a3a",atk:180,pv:1100,def:260,desc:"Bouclier vivant des marches du nord."},
  {id:"brok",name:"Brok",type:"Personnage",rar:"rare",hue:"#5a4a2a",atk:210,pv:760,def:90,desc:"Mineur devenu chasseur de donjons."},
  {id:"sylwen",name:"Sylwen",type:"Personnage",rar:"commune",hue:"#2a4a4a",atk:120,pv:560,def:60,desc:"Éclaireuse de la lisière."}
];
const EQUIP = [
  {id:"marteau",name:"Marteau de Brise-terre",slot:"arme",rar:"epique",hue:"#6a4a2a",bonus:{atk:15},skill:"Brise-terre (Niv. 1)"},
  {id:"armure",name:"Armure de la Forge",slot:"armure",rar:"rare",hue:"#4a4a5a",bonus:{def:8},skill:null},
  {id:"gants",name:"Gantelets de Braise",slot:"gants",rar:"commune",hue:"#5a2a2a",bonus:{atk:5,pv:4},skill:null},
  {id:"amulette",name:"Amulette d'Ashen",slot:"amulette",rar:"legendaire",hue:"#2a3a6a",bonus:{pv:10},skill:"Souffle de cendre"},
  {id:"lame",name:"Lame du Veilleur",slot:"arme",rar:"rare",hue:"#3a4a5a",bonus:{atk:10},skill:null},
  {id:"bouclier",name:"Bouclier de Chêne",slot:"armure",rar:"commune",hue:"#4a3a2a",bonus:{def:4},skill:null}
];
const SLOTS = ["arme","armure","gants","amulette"];
const SLOT_LABEL = {arme:"Arme",armure:"Armure",gants:"Gants",amulette:"Amulette"};

const state = {
  points: 1200,
  inv: {kael:{owned:1,stars:1,level:1},brok:{owned:2,stars:1,level:1},lyra:{owned:1,stars:1,level:1},sylwen:{owned:3,stars:1,level:1},marteau:{owned:1},armure:{owned:1},gants:{owned:2},bouclier:{owned:1}},
  equipped: {kael:{arme:"marteau",armure:"armure",gants:null,amulette:null}},
  view:"collection", filter:"tous", selected:"kael", selEquip:"kael", selEvo:"kael", selSlot:null,
  lastDraw:null, dungeonLog:""
};

const ALL = [...HEROES, ...EQUIP];
const byId = id => ALL.find(x => x.id===id);
const isHero = id => HEROES.some(h=>h.id===id);
const owned = id => (state.inv[id]?.owned)||0;
const sigil = hue => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(241,212,138,.55)" stroke-width="2"/><circle cx="50" cy="50" r="36" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1" stroke-dasharray="3 4"/><path d="M50 12 L60 44 L92 50 L60 56 L50 88 L40 56 L8 50 L40 44 Z" fill="rgba(255,255,255,.22)"/><circle cx="50" cy="50" r="10" fill="rgba(0,0,0,.4)" stroke="rgba(241,212,138,.6)" stroke-width="1.5"/></svg>`;
const stars = n => "★".repeat(n)+"☆".repeat(5-n);
const bonusText = b => Object.entries(b).map(([k,v])=>`${k.toUpperCase()} +${v}%`).join(' · ');
const toast = msg => { const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); };

function heroStats(id){
  const h=byId(id); const s=state.inv[id]||{stars:1,level:1};
  const lvl = 1 + (s.level-1)*0.02;
  const starMul = 1 + (s.stars-1)*0.1;
  const atk=h.atk*lvl*starMul, pv=h.pv*lvl*starMul, def=h.def*lvl*starMul;
  const eq = state.equipped[id]||{};
  let pa=0,pp=0,pd=0;
  Object.values(eq).forEach(eid=>{ if(!eid) return; const b=byId(eid).bonus; pa+=b.atk||0; pp+=b.pv||0; pd+=b.def||0; });
  return {atk:Math.round(atk*(1+pa/100)), pv:Math.round(pv*(1+pp/100)), def:Math.round(def*(1+pd/100)), pa, pp, pd};
}

function cardHTML(item, opts={}){
  const r=RAR[item.rar]; const n=owned(item.id); const locked=n===0 && !opts.force;
  const st = isHero(item.id) ? (state.inv[item.id]?.stars||1) : null;
  const fx = (!locked && (item.rar==='legendaire'||item.rar==='epique')) ? ' shine' : '';
  const leg = (!locked && item.rar==='legendaire') ? ' legend' : '';
  const rev = opts.reveal ? ' reveal' : '';
  const click = opts.onclick!==undefined ? opts.onclick : `pick('${item.id}')`;
  return `<div class="card ${opts.sel?'sel':''} ${locked?'locked':''}${fx}${leg}${rev}" style="--c:${r.c}" data-id="${item.id}" ${click?`onclick="${click}"`:''}>
    ${n>0?`<span class="count">x${n}</span>`:''}
    <div class="art" style="background:radial-gradient(circle at 50% 35%,${item.hue} 0%,#1b1626 78%)">${locked?'?':sigil(item.hue)}</div>
    <div class="name">${locked?'???':item.name}</div>
    <div class="rar">${r.name}</div>
    <div class="meta">${locked?'Non obtenue':(isHero(item.id)?`<span class="stars">${stars(st)}</span>`:(item.skill?'Compétence : '+item.skill:item.slot))}</div>
  </div>`;
}

function pick(id){ state.selected=id; render(); }

function renderNav(){
  const tabs=[["collection","Cartes"],["evolution","Évolution"],["equip","Équipement"],["dungeon","Donjons"],["abyss","Abîme de Hares"],["rarity","Raretés"]];
  document.getElementById("nav").innerHTML=tabs.map(([k,l])=>`<button class="${k==='abyss'?'abyss':''} ${state.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join("");
}
function go(v){ state.view=v; render(); window.scrollTo(0,0); }

function renderCollection(){
  const el=document.getElementById("v-collection");
  const filters=["tous","personnage","equipement",...Object.keys(RAR)];
  const fl={tous:"Tout",personnage:"Personnages",equipement:"Équipement",commune:"Commune",rare:"Rare",epique:"Épique",legendaire:"Légendaire"};
  const list=ALL.filter(x=>{
    if(state.filter==="tous") return true;
    if(state.filter==="personnage") return isHero(x.id);
    if(state.filter==="equipement") return !isHero(x.id);
    return x.rar===state.filter;
  });
  const sel = byId(state.selected) || HEROES[0];
  const total = ALL.filter(x=>owned(x.id)>0).length;
  el.innerHTML=`
    <div class="banner">
      <h1>Le Jeu de Cartes de Project Ashen</h1>
      <p class="sub">Collectionnez, améliorez et équipez vos cartes pour renforcer votre équipe et triompher des donjons d'Ashen. Cartes obtenues : ${total}/${ALL.length}.</p>
    </div>
    <div class="row">
      <div class="panel">
        <div class="filters">${filters.map(f=>`<button class="chip ${state.filter===f?'on':''}" onclick="setFilter('${f}')">${fl[f]}</button>`).join("")}</div>
        <div class="grid">${list.map(x=>cardHTML(x,{sel:x.id===sel.id})).join("")}</div>
      </div>
      <div class="panel">${detailHTML(sel)}</div>
    </div>`;
}
function setFilter(f){ state.filter=f; render(); }

function detailHTML(item){
  const r=RAR[item.rar]; const n=owned(item.id);
  if(n===0) return `<h2>???</h2><p class="hint">Cette carte n'a pas encore été obtenue. Explorez les donjons pour la découvrir.</p><button class="btn ghost" onclick="go('dungeon')">Voir les donjons</button>`;
  if(isHero(item.id)){
    const s=heroStats(item.id); const inv=state.inv[item.id];
    const eq=state.equipped[item.id]||{};
    return `<div style="display:flex;gap:18px;flex-wrap:wrap">
      <div style="width:200px">${cardHTML(item,{onclick:""})}</div>
      <div style="flex:1;min-width:220px">
        <h2 style="margin-top:0">${item.name}</h2>
        <div class="rar" style="color:${r.c};letter-spacing:2px">${r.name} · ${item.type}</div>
        <p class="hint">${item.desc}</p>
        <div class="stat"><span>ATQ</span><b>${s.atk}</b></div>
        <div class="stat"><span>PV</span><b>${s.pv}</b></div>
        <div class="stat"><span>DÉF</span><b>${s.def}</b></div>
        <div class="stat"><span>Niveau</span><b>${inv.level}/50</b></div>
        <div class="stat"><span>Étoiles</span><b class="stars">${stars(inv.stars)}</b></div>
        <p class="hint">Équipement : ${SLOTS.map(sl=>eq[sl]?byId(eq[sl]).name:'-').join(' · ')}</p>
        <button class="btn" onclick="go('evolution')">Faire évoluer</button>
        <button class="btn ghost" onclick="go('equip')">Équiper</button>
      </div>
    </div>`;
  }
  return `<div style="display:flex;gap:18px;flex-wrap:wrap">
    <div style="width:200px">${cardHTML(item,{onclick:""})}</div>
    <div style="flex:1;min-width:220px">
      <h2 style="margin-top:0">${item.name}</h2>
      <div class="rar" style="color:${r.c};letter-spacing:2px">${r.name} · ${item.slot}</div>
      <div class="stat"><span>Bonus</span><b>${bonusText(item.bonus)}</b></div>
      <div class="stat"><span>Compétence</span><b>${item.skill||'Aucune'}</b></div>
      <div class="stat"><span>Exemplaires</span><b>${n}</b></div>
      <p class="hint">Équipez cette pièce sur un personnage dans l'onglet Équipement.</p>
      <button class="btn" onclick="go('equip')">Équiper</button>
    </div>
  </div>`;
}

function renderEvolution(){
  const el=document.getElementById("v-evolution");
  const heroes=HEROES.filter(h=>owned(h.id)>0);
  const id = heroes.find(h=>h.id===state.selEvo)?state.selEvo:(heroes[0]||HEROES[0]).id;
  const h=byId(id); const inv=state.inv[id]||{stars:1,level:1,owned:0};
  const dupNeeded = 1; const ptsNeeded = 1000*inv.stars;
  const maxed = inv.stars>=5;
  const dupOk = inv.owned>dupNeeded;
  const ptsOk = state.points>=ptsNeeded;
  const pct = maxed ? 100 : Math.min(100, Math.round(state.points/ptsNeeded*100));
  el.innerHTML=`
    <div class="banner">
      <h1>Évolution de carte</h1>
      <p class="sub">Faites évoluer vos cartes grâce à des doublons ou aux Points d'Âme pour libérer leur plein potentiel. Chaque évolution ajoute une étoile.</p>
    </div>
    <div class="panel">
      <div class="filters">${heroes.map(x=>`<button class="chip ${x.id===id?'on':''}" onclick="state.selEvo='${x.id}';render()">${x.name}</button>`).join("")}</div>
      <div class="row" style="align-items:center">
        <div class="evo-stage">
          <div style="width:180px">${cardHTML(h,{onclick:""})}</div>
          <div class="arrows">&#187;&#187;&#187;</div>
          <div class="evo-next ${maxed?'maxed':''}">
            <div class="card" style="--c:${RAR[h.rar].c}">
              <div class="art" style="background:radial-gradient(circle at 50% 35%,${h.hue} 0%,#1b1626 78%)">${sigil(h.hue)}</div>
              <div class="name">${h.name}</div><div class="rar">${RAR[h.rar].name}</div>
              <div class="meta"><span class="stars">${stars(Math.min(5,inv.stars+(maxed?0:1)))}</span></div>
            </div>
          </div>
        </div>
        <div>
          <h2 style="margin-top:0">Matériaux requis</h2>
          <div class="stat"><span>Carte identique (en plus de la copie gardée)</span><b style="color:${dupOk?'var(--green)':'var(--red)'}">${Math.max(0,inv.owned-1)}/${dupNeeded}</b></div>
          <div class="stat"><span>Points d'Âme</span><b style="color:${ptsOk?'var(--green)':'var(--red)'}">${state.points.toLocaleString("fr-FR")} / ${ptsNeeded.toLocaleString("fr-FR")}</b></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <p class="hint">Une copie de la carte est toujours conservée. Étoiles : ${inv.stars}/5. Un personnage évolué gagne +10% de statistiques par étoile.</p>
          <button class="btn" ${maxed||!dupOk||!ptsOk?'disabled':''} onclick="evolve('${id}')">${maxed?'Étoiles au maximum':'Évoluer la carte'}</button>
        </div>
      </div>
    </div>`;
}
function evolve(id){
  const inv=state.inv[id]; const cost=1000*inv.stars;
  if(inv.owned<=1 || state.points<cost || inv.stars>=5) return;
  inv.owned-=1; inv.stars+=1; state.points-=cost;
  toast(`${byId(id).name} passe à ${inv.stars} étoiles`);
  render();
}

function renderEquip(){
  const el=document.getElementById("v-equip");
  const heroes=HEROES.filter(h=>owned(h.id)>0);
  if(!heroes.length){ el.innerHTML="<p>Obtenez un personnage pour équiper.</p>"; return; }
  const id = heroes.find(h=>h.id===state.selEquip)?state.selEquip:heroes[0].id;
  const h=byId(id); const s=heroStats(id); const eq=state.equipped[id]||{};
  const slotSel = state.selSlot;
  const items = ALL.filter(x=>!isHero(x.id) && owned(x.id)>0 && (!slotSel || x.slot===slotSel));
  el.innerHTML=`
    <div class="banner">
      <h1>Cartes d'Équipement</h1>
      <p class="sub">Équipez vos héros pour augmenter leurs statistiques et leur donner des compétences supplémentaires.</p>
    </div>
    <div class="panel">
      <div class="filters">${heroes.map(x=>`<button class="chip ${x.id===id?'on':''}" onclick="state.selEquip='${x.id}';state.selSlot=null;render()">${x.name}</button>`).join("")}</div>
      <div class="row">
        <div>
          <h2 style="margin-top:0">${h.name}</h2>
          <div class="stat"><span>ATQ</span><b>${s.atk}</b></div>
          <div class="stat"><span>PV</span><b>${s.pv}</b></div>
          <div class="stat"><span>DÉF</span><b>${s.def}</b></div>
          <div class="slots">
            ${SLOTS.map(sl=>{
              const e=eq[sl]?byId(eq[sl]):null;
              return `<div class="slot ${e?'full':''}" style="${e?`--c:${RAR[e.rar].c}`:''}" onclick="state.selSlot='${sl}';render()">
                <div class="lbl">${SLOT_LABEL[sl]}</div>
                ${e?`<div class="big">${sigil(e.hue).replace('<svg','<svg style="width:40px;height:40px"')}</div><div style="font-size:12px;color:var(--txt)">${e.name}</div><button class="btn ghost" style="padding:4px 8px;font-size:11px;margin-top:6px" onclick="event.stopPropagation();unequip('${id}','${sl}')">Retirer</button>`:'<div class="big">+</div><div>Vide</div>'}
              </div>`;
            }).join("")}
          </div>
          <p class="hint">${slotSel?`Choisissez une pièce pour l'emplacement : ${SLOT_LABEL[slotSel]}.`:'Cliquez sur un emplacement pour y placer une pièce.'}</p>
        </div>
        <div>
          <h2 style="margin-top:0">${slotSel?'Pièces disponibles':'Votre inventaire'}</h2>
          <div class="eqlist">
            ${items.length?items.map(x=>{
              const worn = Object.entries(state.equipped).some(([hid,sl])=>Object.values(sl).includes(x.id));
              return `<div class="eq ${worn?'worn':''}" style="--c:${RAR[x.rar].c}" onclick="equip('${id}','${x.id}')">
                <div class="t">${x.name}</div>
                <div style="color:${RAR[x.rar].c};font-size:12px;font-weight:bold">${RAR[x.rar].name} · ${x.slot}</div>
                <div class="hint">${bonusText(x.bonus)}${x.skill?'<br>'+x.skill:''}</div>
                <div class="hint">${worn?'Déjà équipée':'x'+owned(x.id)+' disponible(s)'}</div>
              </div>`;}).join(""):'<p class="hint">Aucune pièce pour cet emplacement.</p>'}
          </div>
          ${slotSel?`<button class="btn ghost" style="margin-top:12px" onclick="state.selSlot=null;render()">Voir tout l'inventaire</button>`:''}
        </div>
      </div>
    </div>`;
}
function equip(hid,eid){
  const e=byId(eid);
  state.equipped[hid]=state.equipped[hid]||{};
  Object.keys(state.equipped).forEach(k=>{ SLOTS.forEach(sl=>{ if(state.equipped[k][sl]===eid) state.equipped[k][sl]=null; }); });
  state.equipped[hid][e.slot]=eid;
  state.selSlot=null;
  toast(`${e.name} équipée sur ${byId(hid).name}`);
  render();
}
function unequip(hid,sl){ state.equipped[hid][sl]=null; render(); }

function explore(){
  const pools={commune:[],rare:[],epique:[],legendaire:[]};
  ALL.forEach(x=>pools[x.rar].push(x.id));
  const r=Math.random()*100; let acc=0, tier="commune";
  for(const [k,v] of Object.entries(RAR)){ acc+=v.drop; if(r<acc){tier=k;break;} }
  const pool=pools[tier]; const id=pool[Math.floor(Math.random()*pool.length)];
  state.inv[id]=state.inv[id]||{owned:0,stars:1,level:1};
  state.inv[id].owned+=1;
  const x=byId(id);
  state.lastDraw=id;
  state.dungeonLog=`Obtenu : ${x.name} (${RAR[x.rar].name})${state.inv[id].owned>1?' - doublon':''}`;
  toast(state.dungeonLog);
  render();
}
function renderDungeon(){
  const el=document.getElementById("v-dungeon");
  const drawn = state.lastDraw ? byId(state.lastDraw) : null;
  el.innerHTML=`
    <div class="banner">
      <h1>Obtenir des cartes : les donjons</h1>
      <p class="sub">Explorez les donjons d'Ashen pour obtenir de nouvelles cartes : personnages, équipements et cartes rares.</p>
    </div>
    <div class="panel dark dungeon">
      <div class="gate"></div>
      <div class="dv">
        <h2>Donjon des Forges Éteintes</h2>
        <p class="hint">Chaque exploration tire une carte selon les taux de rareté. Plus le donjon est profond, plus les raretés hautes apparaissent.</p>
        <div class="filters" style="margin-top:12px">${Object.entries(RAR).map(([k,v])=>`<span class="chip" style="cursor:default;border-color:${v.c};color:${v.c}">${v.name} : ${v.drop}%</span>`).join("")}</div>
        <button class="btn" onclick="explore()">Explorer le donjon</button>
        <div class="reveal-box">
          ${drawn ? cardHTML(drawn,{onclick:"",reveal:true}) : '<p class="hint" style="margin:0">Lancez une exploration pour découvrir une carte.</p>'}
          <div class="log">${state.dungeonLog||''}</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Cartes trouvables</h2>
      <div class="grid">${ALL.map(x=>cardHTML(x,{onclick:"",force:true})).join("")}</div>
    </div>`;
}

function sellValue(id){ return RAR[byId(id).rar].sell; }
function renderAbyss(){
  const el=document.getElementById("v-abyss");
  const dups = ALL.filter(x=>owned(x.id)>1);
  el.innerHTML=`
    <div class="banner">
      <h1>L'Abîme de Hares</h1>
      <p class="sub">Échangez vos cartes en double contre des Points d'Âme et des ressources d'évolution. Une copie est toujours conservée.</p>
    </div>
    <div class="panel abyss-wrap">
      ${dups.length?`<div class="grid">${dups.map(x=>`
        <div class="abyss-cell">
          ${cardHTML(x,{onclick:""})}
          <button class="btn abyssbtn" onclick="sell('${x.id}')">Échanger 1 contre ${sellValue(x.id)} pts</button>
        </div>`).join("")}</div>`
      :`<p class="hint">Vous n'avez aucun doublon à échanger. Explorez les donjons pour en obtenir.</p>`}
    </div>`;
}
function sell(id){
  if(owned(id)<=1) return;
  state.inv[id].owned-=1; state.points+=sellValue(id);
  toast(`+${sellValue(id)} Points d'Âme`);
  render();
}

function renderRarity(){
  const el=document.getElementById("v-rarity");
  el.innerHTML=`
    <div class="banner">
      <h1>Raretés</h1>
      <p class="sub">Chaque carte appartient à l'une des quatre raretés. Elle influence les taux d'obtention, la valeur d'échange et la puissance.</p>
    </div>
    <div class="panel"><div class="rarity-row">
      ${Object.entries(RAR).map(([k,v])=>`<div style="--c:${v.c}"><b style="color:${v.c};font-size:16px">${v.name}</b><br>Taux de drop : ${v.drop}%<br>Échange : ${v.sell} pts<br>Étoiles de base : ${stars(v.stars)}</div>`).join("")}
    </div></div>
    <div class="panel">
      <h2>Règles en bref</h2>
      <p class="hint">Évolution : 1 doublon et 1000 Points d'Âme x étoiles actuelles, jusqu'à 5 étoiles. Niveau : jusqu'à 50. Équipement : 4 emplacements par héros, une pièce ne peut être portée que par un héros à la fois.</p>
    </div>`;
}

function render(){
  renderNav();
  document.getElementById("pts").textContent=state.points.toLocaleString("fr-FR");
  document.getElementById("total").textContent=ALL.reduce((a,x)=>a+owned(x.id),0);
  ["collection","evolution","equip","dungeon","abyss","rarity"].forEach(v=>{
    document.getElementById("v-"+v).hidden = state.view!==v;
  });
  if(state.view==="collection") renderCollection();
  if(state.view==="evolution") renderEvolution();
  if(state.view==="equip") renderEquip();
  if(state.view==="dungeon") renderDungeon();
  if(state.view==="abyss") renderAbyss();
  if(state.view==="rarity") renderRarity();
}
render();
</script>
</body>
</html>
